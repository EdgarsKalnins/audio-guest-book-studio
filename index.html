<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Guest Book Studio</title>
    <script>
      try {
        var p = new URLSearchParams(window.location.search).get('theme');
        var theme = p || localStorage.getItem('wedding_studio_theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-zinc-100 dark:bg-[#0d0d0f] text-zinc-900 dark:text-[#f4f4f5] select-none overflow-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
