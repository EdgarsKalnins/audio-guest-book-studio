<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Guest Book Studio</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <script>
      try {
        var p = new URLSearchParams(window.location.search).get('theme');
        var theme = p || localStorage.getItem('wedding_studio_theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <style>
      @keyframes studioWaveform {
        0%, 100% { transform: scaleY(0.25); opacity: 0.4; }
        50% { transform: scaleY(1); opacity: 1; }
      }
      .preloader-wave {
        display: inline-block;
        width: 3.5px;
        background: linear-gradient(to top, #d97706, #f59e0b, #fef3c7);
        border-radius: 9999px;
        transform-origin: bottom;
        animation: studioWaveform 0.9s ease-in-out infinite alternate;
      }
    </style>
  </head>
  <body class="bg-zinc-100 dark:bg-[#0d0d0f] text-zinc-900 dark:text-[#f4f4f5] select-none overflow-hidden antialiased">
    <div id="root">
      <!-- High-fidelity branded preloader before React hydrates -->
      <div style="height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0d0d0f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="position: relative; width: 72px; height: 72px; margin-bottom: 20px;">
          <img src="/icon.svg" alt="Audio Guest Book Studio" style="width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 25px rgba(245, 158, 11, 0.25));" />
        </div>
        <div style="display: flex; align-items: center; gap: 5px; height: 28px; margin-bottom: 16px;">
          <span class="preloader-wave" style="height: 40%; animation-delay: 0.00s;"></span>
          <span class="preloader-wave" style="height: 75%; animation-delay: 0.10s;"></span>
          <span class="preloader-wave" style="height: 55%; animation-delay: 0.20s;"></span>
          <span class="preloader-wave" style="height: 95%; animation-delay: 0.30s;"></span>
          <span class="preloader-wave" style="height: 100%; animation-delay: 0.40s;"></span>
          <span class="preloader-wave" style="height: 65%; animation-delay: 0.50s;"></span>
          <span class="preloader-wave" style="height: 85%; animation-delay: 0.60s;"></span>
          <span class="preloader-wave" style="height: 45%; animation-delay: 0.70s;"></span>
        </div>
        <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.05em; color: #a1a1aa; text-transform: uppercase;">
          Audio Guest Book Studio
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
