<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a2215" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#141418" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="1"/>
    </radialGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#dfc596" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Gold Foil Gradients -->
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="75%" stop-color="#dfc596"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="35%" stop-color="#fef3c7"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Wave Glow -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="20%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#fffbeb" stop-opacity="1"/>
      <stop offset="80%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Filter for Soft Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="ambientLight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Golden Backlight -->
  <circle cx="256" cy="240" r="140" fill="#f59e0b" opacity="0.18" filter="url(#ambientLight)"/>

  <!-- Squircle Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGlow)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" stroke="url(#borderGrad)" stroke-width="3" fill="none"/>

  <!-- Subtle Inner Groove Ring -->
  <circle cx="256" cy="256" r="172" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5" stroke-dasharray="6 8"/>
  <circle cx="256" cy="256" r="140" stroke="#f59e0b" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Intertwined Wedding Ring (Halo) -->
  <g filter="url(#goldGlow)">
    <circle cx="256" cy="256" r="108" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>

  <!-- Vintage Telephone Handset Arch Motif -->
  <g filter="url(#goldGlow)">
    <!-- Handset Bridge Arc -->
    <path d="M 160 210 C 180 156, 332 156, 352 210" 
          stroke="url(#goldShimmer)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Left Earpiece Bulb -->
    <rect x="144" y="196" width="32" height="60" rx="14" 
          fill="url(#goldShimmer)" transform="rotate(-18 160 226)"/>
    <!-- Right Mouthpiece Bulb -->
    <rect x="336" y="196" width="32" height="60" rx="14" 
          fill="url(#goldShimmer)" transform="rotate(18 352 226)"/>
  </g>

  <!-- Centered Audio Waveform Equalizer (Horizontal Frequency Bars) -->
  <g filter="url(#goldGlow)">
    <!-- Symmetrical Wave Bars crossing the center -->
    <rect x="136" y="292" width="6" height="24" rx="3" fill="url(#waveGrad)"/>
    <rect x="152" y="280" width="6" height="48" rx="3" fill="url(#waveGrad)"/>
    <rect x="168" y="288" width="6" height="32" rx="3" fill="url(#waveGrad)"/>
    <rect x="184" y="266" width="6" height="76" rx="3" fill="url(#waveGrad)"/>
    <rect x="200" y="254" width="6" height="100" rx="3" fill="url(#waveGrad)"/>
    <rect x="216" y="272" width="6" height="64" rx="3" fill="url(#waveGrad)"/>
    <rect x="232" y="244" width="6" height="120" rx="3" fill="url(#waveGrad)"/>
    
    <!-- Epicenter Peak (Center) -->
    <rect x="248" y="234" width="7" height="140" rx="3.5" fill="#ffffff"/>
    <rect x="257" y="234" width="7" height="140" rx="3.5" fill="url(#waveGrad)"/>
    
    <rect x="274" y="244" width="6" height="120" rx="3" fill="url(#waveGrad)"/>
    <rect x="290" y="272" width="6" height="64" rx="3" fill="url(#waveGrad)"/>
    <rect x="306" y="254" width="6" height="100" rx="3" fill="url(#waveGrad)"/>
    <rect x="322" y="266" width="6" height="76" rx="3" fill="url(#waveGrad)"/>
    <rect x="338" y="288" width="6" height="32" rx="3" fill="url(#waveGrad)"/>
    <rect x="354" y="280" width="6" height="48" rx="3" fill="url(#waveGrad)"/>
    <rect x="370" y="292" width="6" height="24" rx="3" fill="url(#waveGrad)"/>
  </g>

  <!-- Star Sparkles -->
  <!-- Top Right 4-Point Diamond Sparkle -->
  <path d="M 374 130 Q 374 146, 390 146 Q 374 146, 374 162 Q 374 146, 358 146 Q 374 146, 374 130 Z" 
        fill="#fffbeb" opacity="0.95"/>
  <circle cx="374" cy="146" r="2.5" fill="#ffffff"/>

  <!-- Left Secondary Sparkle -->
  <path d="M 134 330 Q 134 340, 144 340 Q 134 340, 134 350 Q 134 340, 124 340 Q 134 340, 134 330 Z" 
        fill="#f59e0b" opacity="0.8"/>
</svg>
